<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VyapaarAI</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--mut:#5b6475;--pri:#0b6b5c;--on:#fff;--bd:#e1e4ea;--red:#b42318;--nav:#12332e;--warn:#fff6dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1417;--card:#1a2125;--ink:#e8ecef;--mut:#9aa6ad;--pri:#2fb59f;--on:#04221d;--bd:#2b353b;--red:#ff8a7a;--nav:#0b1f1c;--warn:#3a3217}}
:root[data-theme=dark]{--bg:#0f1417;--card:#1a2125;--ink:#e8ecef;--mut:#9aa6ad;--pri:#2fb59f;--on:#04221d;--bd:#2b353b;--red:#ff8a7a;--nav:#0b1f1c;--warn:#3a3217}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:0 14px 90px;max-width:640px;margin:0 auto;overflow-x:hidden}
h1{font-size:21px;margin:14px 0 8px}h3{margin:0 0 8px;font-size:16px}.mut,small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpis .card{margin:0}.kpis b{font-size:19px;display:block}
input,select,textarea,button{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
button{cursor:pointer}.pri{background:var(--pri);color:var(--on);border-color:var(--pri)}.sm{padding:6px 10px;font-size:13px}.dng{color:var(--red)}
:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
.f{display:flex;flex-direction:column;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.r>*{flex:1;min-width:120px}.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.acts button{flex:0 0 auto}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:6px}.bar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar i{width:100%;background:var(--pri);border-radius:3px 3px 0 0;display:block}.bar span{font-size:9px;color:var(--mut);white-space:nowrap;overflow:hidden;max-width:100%}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:9px;background:var(--bd);display:inline-block;margin-bottom:6px}.pill.High{background:#fde3e0;color:#b42318}.pill.Medium{background:#fff1cc;color:#6b4e00}
.ban{background:var(--warn);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px}
.done{text-decoration:line-through;color:var(--mut)}.od{color:var(--red);font-weight:600}.empty{text-align:center;color:var(--mut);padding:18px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:#cfe3de;font-size:11px;padding:8px 2px;border-radius:8px;position:relative}nav button.on{background:#1d4d45;color:#fff;font-weight:600}
nav em{position:absolute;top:2px;right:6px;background:#f0b429;color:#000;border-radius:8px;font-size:10px;padding:0 5px;font-style:normal}
#t{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));background:var(--nav);color:#fff;padding:12px;border-radius:10px;z-index:9;display:none}#t.e{background:#b42318}
#m{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:10;padding:20px}#m div{background:var(--card);padding:18px;border-radius:12px;max-width:340px;width:100%}
textarea{width:100%}li{margin-bottom:4px}ul{padding-left:18px;margin:0}
@media(min-width:900px){body{max-width:920px}.kpis{grid-template-columns:repeat(3,1fr)}nav{left:50%;right:auto;width:560px;transform:translateX(-50%);border-radius:14px 14px 0 0}}
.hd{padding:14px 0 0}.hd b{font-size:19px;color:var(--pri);display:block}
@media(min-width:900px){body{max-width:920px}.kpis{grid-template-columns:repeat(4,1fr)}nav{left:50%;right:auto;width:560px;transform:translateX(-50%);border-radius:14px 14px 0 0}}
</style></head><body>
<div id="t" role="status"></div><div id="m"><div><p id="mq"></p><div class="acts"><button class="pri" id="my">Confirm</button><button id="mn">Cancel</button></div></div></div>
<div class="hd"><b>VyapaarAI</b><small>Your next sale starts with your next smart action.</small></div><div id="app"></div><nav id="nav" aria-label="Main"></nav>
<script>
const $=s=>document.querySelector(s),DAY=864e5,iso=d=>new Date(d).toISOString().slice(0,10),ago=n=>iso(Date.now()-n*DAY),since=s=>Math.floor((Date.now()-new Date(s))/DAY),uid=()=>Math.random().toString(36).slice(2,9);
const inr=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=['Grocery','Dairy','Snacks','Household','Personal Care'],ECATS=['Rent','Stock purchase','Electricity','Salary','Other'],KEY='vyapaarai.v1',sum=a=>a.reduce((t,x)=>t+x.amount,0);
function seed(){const P=[['Ramesh Gupta',2,1800,3],['Sunita Verma',3,900,5],['Anil Kapoor',4,2600,40],['Meena Iyer',2,700,2],['Farhan Sheikh',5,1500,36],['Pooja Nair',3,1100,6],['Harpreet Singh',6,3200,28],['Kavita Joshi',4,600,55]];
const customers=P.map((p,i)=>({id:'c'+i,name:p[0],phone:'98100000'+(10+i),notes:i==2?'Prefers monthly grocery bundle':i==4?'Buys snacks for shop events':''})),sales=[],expenses=[];
P.forEach((p,i)=>{for(let d=p[3];d<=85;d+=p[1]+Math.floor(p[1]*(i%3)/2)+(i>1?3:0)){const c=CATS[(d+i)%5];if(c==='Dairy'&&d<30&&d%2)continue;sales.push({id:'s'+i+'_'+d,date:ago(d),amount:Math.round(p[2]*(.5+((d*7+i)%5)/10)/10)*10,category:c,customerId:'c'+i});}});
for(let m=0;m<3;m++)expenses.push({id:'ea'+m,date:ago(m*30+2),amount:15000,category:'Rent',note:'Shop rent'},{id:'eb'+m,date:ago(m*30+8),amount:9000+m*700,category:'Stock purchase',note:'Wholesale stock'},{id:'ec'+m,date:ago(m*30+12),amount:2200,category:'Electricity',note:''});
['c6','c2'].forEach(id=>sales.filter(s=>s.customerId===id).slice(0,1).forEach(s=>s.paid=false));return{customers,sales,expenses,followups:[{id:'f1',customerId:'c2',title:'Check why monthly order stopped',due:ago(3),priority:'High',done:false},{id:'f2',customerId:'c6',title:'Offer festive bulk discount',due:ago(-2),priority:'Medium',done:false},{id:'f3',customerId:'c0',title:'Thank for referral',due:ago(10),priority:'Low',done:true}],demo:true};}
const empty=()=>({customers:[],sales:[],expenses:[],followups:[],demo:false});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(!s)return seed();const a=k=>Array.isArray(s[k])?s[k].filter(x=>x&&x.id):[];return{customers:a('customers'),sales:a('sales'),expenses:a('expenses'),followups:a('followups'),demo:!!s.demo};}catch(e){return seed();}}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let S=load(),U={tab:'Overview',days:30,q:'',sort:'name',edit:null,view:null,wc:'',goal:'winback',lang:'en',fil:'open'};
const cn=id=>(S.customers.find(c=>c.id===id)||{}).name||'Walk-in';
function cs(c){const m=S.sales.filter(x=>x.customerId===c.id).sort((a,b)=>b.date.localeCompare(a.date)),o=S.followups.filter(f=>f.customerId===c.id&&!f.done);
return{total:sum(m),count:m.length,last:m[0]?m[0].date:null,ds:m[0]?since(m[0].date):null,status:o.some(f=>f.due<iso(Date.now()))?'Overdue':o.length?'Pending':'None'};}
function metrics(){const from=U.days?ago(U.days):'0',sa=S.sales.filter(x=>x.date>=from),ex=S.expenses.filter(x=>x.date>=from),bc={};sa.forEach(x=>bc[x.category]=(bc[x.category]||0)+x.amount);
const w=Math.min(13,Math.ceil((U.days||90)/7)),tr=[];for(let i=w-1;i>=0;i--){const a=ago(i*7+6),b=ago(i*7);tr.push({l:b.slice(5),v:sum(S.sales.filter(x=>x.date>=a&&x.date<=b))});}
return{s:sum(sa),e:sum(ex),p:sum(sa)-sum(ex),bc,tr};}
function recs(){const o=[],t=iso(Date.now()),st=S.customers.map(c=>({c,...cs(c)})),v=st.map(x=>x.total).sort((a,b)=>a-b),top=v[Math.floor(v.length*.7)]??Infinity;
st.forEach(({c,total,ds,last,count})=>{if(ds===null)return;const hv=total>=top&&total>0;if(ds>=30||(hv&&ds>=21))o.push({id:'r'+c.id,k:'lapsed',cid:c.id,pr:hv||ds>=45?'High':'Medium',a:'Reach out to '+c.name,why:`Last purchase ${ds} days ago (${last}); ${count} purchases worth ${inr(total)} in total${hv?', among your top-value customers':''}.`,next:'Draft a WhatsApp message',risk:total/Math.max(1,count)});});
S.sales.filter(x=>x.paid===false).forEach(x=>{const d=since(x.date);o.push({id:'u'+x.id,k:'udhaar',cid:x.customerId,pr:d>=14?'High':'Medium',a:`Collect ${inr(x.amount)} from ${cn(x.customerId)}`,why:`Udhaar sale on ${x.date} (${d} days ago) is still unpaid.`,next:'Draft payment reminder'});});S.followups.filter(f=>!f.done&&f.due<t).forEach(f=>o.push({id:'o'+f.id,k:'overdue',pr:'High',a:'Complete overdue task: '+f.title,why:`Due ${f.due}, ${since(f.due)} days ago for ${cn(f.customerId)}.`,next:'Open tasks'}));
const cu={},pv={};S.sales.forEach(x=>{const d=since(x.date);if(d<30)cu[x.category]=(cu[x.category]||0)+x.amount;else if(d<60)pv[x.category]=(pv[x.category]||0)+x.amount;});
Object.keys(pv).forEach(k=>{const p=pv[k],c=cu[k]||0;if(p>=1000&&c<p*.75)o.push({id:'k'+k,k:'cat',pr:'Medium',a:`Review ${k} stock and promotions`,why:`${k} sales fell ${Math.round((1-c/p)*100)}% (${inr(p)} to ${inr(c)}) versus the previous 30 days.`,next:'Add a task'});});
const w={High:0,Medium:1,Low:2};return o.sort((a,b)=>w[a.pr]-w[b.pr]);}
function draft(c,g,l){const due=sum(S.sales.filter(x=>x.customerId===c.id&&x.paid===false)),s=cs(c),f=c.name.split(' ')[0],m={};S.sales.filter(x=>x.customerId===c.id).forEach(x=>m[x.category]=(m[x.category]||0)+1);const fav=(Object.entries(m).sort((a,b)=>b[1]-a[1])[0]||[])[0],h=l==='hi';
return{winback:h?`Namaste ${f} ji! Kaafi time ho gaya, aapko dukaan par dekhe${s.ds?` (last visit ${s.ds} din pehle)`:''}. ${fav?`Aapka favourite ${fav} ka naya stock aaya hai. `:''}Aap kab aa rahe hain? Aapke liye special offer rakha hai.`:`Hello ${f}, it has been a while since your last visit${s.ds?` (${s.ds} days ago)`:''}. ${fav?`We have fresh ${fav} stock you may like. `:''}We would love to see you again and have a small offer ready for you.`,
pay:h?`Namaste ${f} ji, aapka ${inr(due)} ka hisaab abhi baaki hai. Jab suvidha ho tab bhej dijiye. Dhanyavaad!`:`Hello ${f}, a gentle reminder that ${inr(due)} is pending on your account. Please pay when convenient. Thank you!`,thanks:h?`Namaste ${f} ji, hamari dukaan se kharidari ke liye bahut dhanyavaad! Aapka saath humare liye important hai.`:`Hello ${f}, thank you for shopping with us. We truly value your support.`,
offer:h?`Namaste ${f} ji! Is hafte ${fav||'selected items'} par special discount hai. Aaiye dukaan par, ya reply karein, hum ready rakhenge.`:`Hello ${f}, we have a special discount this week on ${fav||'selected items'}. Visit us or reply and we will keep it ready for you.`}[g];}
const TOUR=[['Overview','Step 1/6: Read the shop’s numbers: sales, expenses, profit and udhaar.'],['Advisor','Step 2/6: Every action has a reason from your data. Tap one.'],['Writer','Step 3/6: A personalised draft is ready. Copy it or open WhatsApp; you press send.'],['Tasks','Step 4/6: Complete a follow-up task.'],['Sales','Step 5/6: Add a sale (try udhaar). Metrics update instantly.'],['Overview','Step 6/6: See the dashboard change.']];
function tourGo(i){if(i>=TOUR.length){U.tour=null;render();return;}U.tour=i;U.tab=TOUR[i][0];U.edit=null;if(TOUR[i][0]==='Writer'&&!U.wc){U.wc='c2';U.goal='winback';}render();window.scrollTo(0,0);}
function toast(m,e){const t=$('#t');t.textContent=m;t.className=e?'e':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500);}
function ask(q,fn){$('#mq').textContent=q;$('#m').style.display='flex';$('#my').onclick=()=>{$('#m').style.display='none';fn();};$('#mn').onclick=()=>$('#m').style.display='none';}
const opt=(l,s)=>l.map(x=>`<option${x===s?' selected':''}>${esc(x)}</option>`).join('');
const csel=(s)=>`<select name="customerId" aria-label="Customer"><option value="">Walk-in</option>${S.customers.map(c=>`<option value="${c.id}"${c.id===s?' selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
const bars=d=>{const mx=Math.max(1,...d.map(x=>x.v));return`<div class="bars" role="img" aria-label="Bar chart">${d.map(x=>`<div class="bar"><span>${x.v>=1000?Math.round(x.v/1000)+'k':x.v}</span><i style="height:${Math.max(2,x.v/mx*100)}%"></i><span>${esc(x.l)}</span></div>`).join('')}</div>`;};
const TABS=['Overview','Customers','Sales','Tasks','Advisor','Writer'];
function view(){const e=U.edit;let h=S.demo?'<div class="ban">Demo data for an imaginary store. Recommendations are rule-based, not an AI model. <button class="sm" data-a="tour">Start guided demo</button></div>':'';if(U.tour!=null)h+=`<div class="card" style="border-color:var(--pri)"><b>${TOUR[U.tour][1]}</b><div class="acts"><button class="pri sm" data-a="tnext">${U.tour==5?'Finish':'Next'}</button><button class="sm" data-a="tend">Skip tour</button></div></div>`;
if(U.tab==='Overview'){const m=metrics(),op=S.followups.filter(f=>!f.done).length;
h+=`<h1>Business overview</h1><div class="r"><select data-m="days" aria-label="Period"><option value="7"${U.days==7?' selected':''}>Last 7 days</option><option value="30"${U.days==30?' selected':''}>Last 30 days</option><option value="90"${U.days==90?' selected':''}>Last 90 days</option><option value="0"${U.days==0?' selected':''}>All time</option></select></div>
<div class="kpis"><div class="card"><small>Total sales</small><b>${inr(m.s)}</b></div><div class="card"><small>Expenses</small><b>${inr(m.e)}</b></div><div class="card"><small>Estimated profit</small><b>${inr(m.p)}</b></div><div class="card"><small>Customers</small><b>${S.customers.length}</b></div><div class="card"><small>Open follow-ups</small><b>${op}</b></div><div class="card"><small>Udhaar pending</small><b>${inr(sum(S.sales.filter(x=>x.paid===false)))}</b></div><div class="card"><small>Active customers (30d)</small><b>${S.customers.filter(c=>{const d=cs(c).ds;return d!==null&&d<30}).length}/${S.customers.length}</b></div><div class="card"><small>Not seen in 30+ days</small><b>${S.customers.filter(c=>{const d=cs(c).ds;return d!==null&&d>=30}).length}</b></div></div>
<p class="mut" style="font-size:13px">Profit is estimated from recorded sales minus recorded expenses and may exclude unrecorded costs.</p>
<div class="card"><h3>Weekly sales (₹)</h3>${bars(m.tr)}</div><div class="card"><h3>Sales by category (₹)</h3>${Object.keys(m.bc).length?bars(Object.entries(m.bc).map(([l,v])=>({l:l.split(' ')[0],v}))):'<p class="empty">No sales in this period.</p>'}</div>`;}
if(U.tab==='Customers'){const L=S.customers.map(c=>({...c,...cs(c)})).filter(c=>(c.name+c.phone).toLowerCase().includes(U.q.toLowerCase())).sort((a,b)=>U.sort==='value'?b.total-a.total:U.sort==='recent'?(b.last||'').localeCompare(a.last||''):a.name.localeCompare(b.name));
h+=`<h1>Customers</h1><div class="r"><input id="q" data-m="q" placeholder="Search name or phone" value="${esc(U.q)}" aria-label="Search"><select data-m="sort" aria-label="Sort"><option value="name">Name</option><option value="value"${U.sort=='value'?' selected':''}>Highest value</option><option value="recent"${U.sort=='recent'?' selected':''}>Most recent</option></select></div><button class="pri" data-a="newc" style="width:100%;margin-bottom:10px">Add customer</button>`;
if(e&&e.kind==='c')h+=`<form class="card f" data-f="cust"><input name="name" placeholder="Name" value="${esc(e.name)}"><input name="phone" inputmode="tel" placeholder="Phone (10 digits)" value="${esc(e.phone)}"><input name="notes" placeholder="Notes" value="${esc(e.notes)}"><button class="pri">Save</button><button type="button" data-a="cancel">Cancel</button></form>`;
h+=L.length?L.map(c=>`<div class="card"><b>${esc(c.name)}</b> <small>${esc(c.phone)}</small><br><small>Last: ${c.last?c.last+' ('+c.ds+'d ago)':'none'} · Total ${inr(c.total)} · Follow-up: ${c.status}${(()=>{const u=sum(S.sales.filter(x=>x.customerId===c.id&&x.paid===false));return u?' · <span class="od">Udhaar '+inr(u)+'</span>':''})()}</small>
${U.view===c.id?`<p>${esc(c.notes||'No notes')}</p><ul>${S.sales.filter(x=>x.customerId===c.id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(x=>`<li>${x.date} · ${x.category} · ${inr(x.amount)}</li>`).join('')||'<li>No purchases</li>'}</ul>`:''}
<div class="acts"><button class="sm" data-a="viewc:${c.id}">${U.view===c.id?'Hide':'View'}</button><button class="sm" data-a="editc:${c.id}">Edit</button><button class="sm dng" data-a="delc:${c.id}">Delete</button></div></div>`).join(''):'<p class="empty">No customers found. Add your first customer.</p>';}
if(U.tab==='Sales'){h+=`<h1>Sales &amp; expenses</h1><form class="card f" data-f="sale"><h3>Add sale</h3><input type="date" name="date" value="${iso(Date.now())}" aria-label="Date"><input name="amount" type="number" inputmode="decimal" step="any" placeholder="Amount (INR)"><select name="category" aria-label="Category">${opt(CATS)}</select>${csel('')}<select name="paid" aria-label="Payment"><option value="1">Paid now</option><option value="0">Udhaar (pay later)</option></select><button class="pri">Add sale</button></form>
<form class="card f" data-f="exp"><h3>Add expense</h3><input type="date" name="date" value="${iso(Date.now())}" aria-label="Date"><input name="amount" type="number" inputmode="decimal" step="any" placeholder="Amount (INR)"><select name="category" aria-label="Category">${opt(ECATS)}</select><input name="note" placeholder="Note"><button class="pri">Add expense</button></form>`;
[['Recent sales','sales'],['Recent expenses','expenses']].forEach(([t,k])=>{h+=`<div class="card"><h3>${t}</h3>${S[k].length?'<ul>'+[...S[k]].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).map(x=>`<li>${x.date} · ${esc(x.category)}${k==='sales'?' · '+esc(cn(x.customerId)):''} · <b>${inr(x.amount)}</b>${x.paid===false?` <span class="od">UDHAAR</span> <button class="sm" data-a="paid:${x.id}">Mark paid</button>`:''} <button class="sm dng" data-a="delr:${k}:${x.id}" aria-label="Delete record">×</button></li>`).join('')+'</ul>':'<p class="empty">No records yet.</p>'}</div>`;});}
if(U.tab==='Tasks'){const L=S.followups.filter(f=>U.fil==='all'||(U.fil==='open'?!f.done:f.done)).sort((a,b)=>a.due.localeCompare(b.due)),t=iso(Date.now());
h+=`<h1>Follow-ups</h1><div class="r"><select data-m="fil" aria-label="Filter"><option value="open"${U.fil=='open'?' selected':''}>Open</option><option value="done"${U.fil=='done'?' selected':''}>Completed</option><option value="all"${U.fil=='all'?' selected':''}>All</option></select><button class="pri" data-a="newf">New follow-up</button></div>`;
if(e&&e.kind==='f')h+=`<form class="card f" data-f="fu"><input name="title" placeholder="Task" value="${esc(e.title)}">${csel(e.customerId)}<input type="date" name="due" value="${e.due||t}" aria-label="Due date"><select name="priority" aria-label="Priority">${opt(['High','Medium','Low'],e.priority||'Medium')}</select><button class="pri">Save</button><button type="button" data-a="cancel">Cancel</button></form>`;
h+=L.length?L.map(f=>`<div class="card"><b class="${f.done?'done':''}">${esc(f.title)}</b><br><small>${esc(cn(f.customerId))} · due ${f.due} · ${f.priority} ${!f.done&&f.due<t?'<span class="od">overdue</span>':''}</small><div class="acts"><button class="sm" data-a="done:${f.id}">${f.done?'Reopen':'Complete'}</button><button class="sm" data-a="editf:${f.id}">Edit</button><button class="sm dng" data-a="delf:${f.id}">Delete</button></div></div>`).join(''):'<p class="empty">Nothing here.</p>';}
if(U.tab==='Advisor'){const R=recs(),risk=sum(R.filter(r=>r.k==='lapsed').map(r=>({amount:r.risk})));
h+=`<h1>Growth Advisor</h1><p class="mut" style="font-size:13px">Rule-based recommendations computed from your stored records. No AI model is called.</p>${risk?`<div class="card"><small>Typical value of one visit from each lapsed customer</small><br><b>${inr(risk)}</b></div>`:''}`;
h+=R.length?R.map(r=>`<div class="card"><span class="pill ${r.pr}">${r.pr} priority</span><h3>${esc(r.a)}</h3><p>${esc(r.why)}</p><button class="pri" data-a="rec:${r.id}">${r.next}</button></div>`).join(''):'<p class="empty">No recommendations right now. Add more sales and customers to get insights.</p>';h+=`<div class="card"><h3>How these rules work</h3><ul><li>Lapsed: no purchase for 30+ days, or 21+ days for your top-value customers.</li><li>Udhaar: any unpaid sale; High priority after 14 days.</li><li>Overdue: a follow-up past its due date.</li><li>Category drop: a category falls 25%+ versus the previous 30 days.</li></ul><small>Rule-based and deterministic. No AI model is called and no data leaves your device.</small></div>`;}
if(U.tab==='Writer'){const c=S.customers.find(x=>x.id===U.wc);
h+=`<h1>Message writer</h1><p class="mut" style="font-size:13px">Template-based drafts (not AI-generated). Nothing is sent automatically.</p><div class="r"><select data-m="wc" aria-label="Customer"><option value="">Choose customer</option>${S.customers.map(x=>`<option value="${x.id}"${x.id===U.wc?' selected':''}>${esc(x.name)}</option>`).join('')}</select>
<select data-m="goal" aria-label="Goal"><option value="winback">Win back</option><option value="thanks"${U.goal=='thanks'?' selected':''}>Thank you</option><option value="offer"${U.goal=='offer'?' selected':''}>Offer</option><option value="pay"${U.goal=='pay'?' selected':''}>Payment reminder</option></select><select data-m="lang" aria-label="Language"><option value="en">English</option><option value="hi"${U.lang=='hi'?' selected':''}>Hinglish</option></select></div>`;
h+=c?`<div class="card"><textarea id="dr" rows="7" readonly>${esc(draft(c,U.goal,U.lang))}</textarea><button class="pri" data-a="copy" style="width:100%;margin-top:8px">Copy to clipboard</button><a class="pri" style="display:block;text-align:center;margin-top:8px;padding:10px;border-radius:8px;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/91${esc(c.phone.slice(-10))}?text=${encodeURIComponent(draft(c,U.goal,U.lang))}">Open in WhatsApp (you press send)</a></div>`:'<p class="empty">Choose a customer to generate a draft.</p>';}
h+=`<div class="acts" style="margin-top:14px"><button class="sm" data-a="reset">Reset demo data</button><button class="sm" data-a="empty">Start empty</button><button class="sm" data-a="csv">Export sales CSV</button><button class="sm" data-a="json">Backup (JSON)</button><button class="sm" data-a="imp">Restore backup</button><input type="file" id="imp" accept=".json" hidden></div>`;return h;}
function render(){const R=recs().length;$('#app').innerHTML=view();$('#nav').innerHTML=TABS.map(t=>`<button class="${U.tab===t?'on':''}" data-a="tab:${t}">${t}${t==='Advisor'&&R?`<em>${R}</em>`:''}</button>`).join('');}
function go(){persist();render();}
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const[a,x,y]=b.dataset.a.split(':');
if(a==='tab'){U.tab=x;U.edit=null;window.scrollTo(0,0);render();}
else if(a==='newc'){U.edit={kind:'c',name:'',phone:'',notes:''};render();}
else if(a==='editc'){U.edit={kind:'c',...S.customers.find(c=>c.id===x)};render();}
else if(a==='viewc'){U.view=U.view===x?null:x;render();}
else if(a==='cancel'){U.edit=null;render();}
else if(a==='delc')ask('Delete this customer and their follow-ups? Their sales stay as walk-in.',()=>{S.customers=S.customers.filter(c=>c.id!==x);S.followups=S.followups.filter(f=>f.customerId!==x);S.sales.forEach(s=>{if(s.customerId===x)s.customerId=''});toast('Customer deleted');go();});
else if(a==='delr')ask('Delete this record?',()=>{S[x]=S[x].filter(r=>r.id!==y);go();});
else if(a==='newf'){U.edit={kind:'f',title:'',customerId:''};render();}
else if(a==='editf'){U.edit={kind:'f',...S.followups.find(f=>f.id===x)};render();}
else if(a==='done'){const f=S.followups.find(f=>f.id===x);f.done=!f.done;toast(f.done?'Follow-up completed':'Reopened');go();}
else if(a==='delf')ask('Delete this task?',()=>{S.followups=S.followups.filter(f=>f.id!==x);go();});
else if(a==='rec'){const r=recs().find(r=>r.id===x);if(!r)return;if(r.k==='lapsed'||r.k==='udhaar'){U.wc=r.cid;U.goal=r.k==='udhaar'?'pay':'winback';U.tab='Writer';}else if(r.k==='overdue')U.tab='Tasks';else{U.tab='Tasks';U.edit={kind:'f',title:r.a,customerId:''};}render();window.scrollTo(0,0);}
else if(a==='paid'){S.sales.find(s=>s.id===x).paid=true;toast('Marked as paid');go();}
else if(a==='tour')tourGo(0);else if(a==='tnext')tourGo(U.tour+1);else if(a==='tend'){U.tour=null;render();}
else if(a==='imp')$('#imp').click();
else if(a==='json'){try{const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='vyapaarai-backup.json';l.click();toast('Backup downloaded');}catch(e){toast('Export is not supported in this view',1);}}
else if(a==='csv'){const rows=['date,customer,category,amount,status',...S.sales.map(s=>[s.date,'"'+cn(s.customerId).replace(/"/g,'""')+'"',s.category,s.amount,s.paid===false?'unpaid':'paid'].join(','))].join('\n');try{const u=URL.createObjectURL(new Blob([rows],{type:'text/csv'}));const l=document.createElement('a');l.href=u;l.download='vyapaarai-sales.csv';l.click();toast('Sales CSV exported');}catch(e){toast('Export is not supported in this view',1);}}
else if(a==='copy'){const t=$('#dr').value;try{await navigator.clipboard.writeText(t);toast('Copied. Paste it into WhatsApp yourself; nothing was sent.');}catch(e){$('#dr').removeAttribute('readonly');$('#dr').select();toast('Clipboard blocked. Text is selected: long-press and choose Copy.',1);}}
else if(a==='reset')ask('Replace ALL data with demo data?',()=>{S=seed();toast('Demo data restored');go();});
else if(a==='empty')ask('Delete ALL records and start empty?',()=>{S=empty();toast('Started with empty data');go();});});
document.addEventListener('change',ev=>{if(ev.target.id==='imp'){const fl=ev.target.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{try{const s=JSON.parse(rd.result);if(!Array.isArray(s.customers)||!Array.isArray(s.sales))throw 0;const ok=k=>Array.isArray(s[k])?s[k].filter(x=>x&&x.id):[];ask('Replace current data with this backup?',()=>{S={customers:ok('customers'),sales:ok('sales'),expenses:ok('expenses'),followups:ok('followups'),demo:!!s.demo};toast('Backup restored');go();});}catch(e){toast('Invalid backup file',1);}};rd.readAsText(fl);return;}const k=ev.target.dataset.m;if(!k)return;U[k]=k==='days'?+ev.target.value:ev.target.value;render();});
document.addEventListener('input',ev=>{if(ev.target.dataset.m==='q'){U.q=ev.target.value;render();const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length);}});
document.addEventListener('submit',ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target)),k=ev.target.dataset.f,e=U.edit;
if(k==='cust'){const name=f.name.trim(),ph=f.phone.replace(/\D/g,'');if(!name)return toast('Name is required',1);if(ph.length<10)return toast('Enter a valid 10-digit phone number',1);
if(S.customers.some(c=>c.phone.slice(-10)===ph.slice(-10)&&c.id!==e.id))return toast('A customer with this phone already exists',1);
if(e.id)Object.assign(S.customers.find(c=>c.id===e.id),{name,phone:ph,notes:f.notes});else S.customers.push({id:uid(),name,phone:ph,notes:f.notes});U.edit=null;toast('Customer saved');}
else if(k==='sale'||k==='exp'){const amt=+f.amount;if(!(amt>0)||!f.date)return toast('Enter a positive amount and a date',1);
if(k==='sale'){if(f.paid==='0'&&!f.customerId)return toast('Select a customer for udhaar',1);S.sales.push({id:uid(),date:f.date,amount:amt,category:f.category,customerId:f.customerId,paid:f.paid!=='0'});toast('Sale of '+inr(amt)+' added');}else{S.expenses.push({id:uid(),date:f.date,amount:amt,category:f.category,note:f.note});toast('Expense added');}}
else if(k==='fu'){if(!f.title.trim()||!f.due)return toast('Title and due date are required',1);if(e.id)Object.assign(S.followups.find(x=>x.id===e.id),f);else S.followups.push({id:uid(),...f,done:false});U.edit=null;toast('Follow-up saved');}
go();});
render();
</script></body></html>
